name: Validate Plugins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Test release scripts
        run: node --test scripts/*.test.mjs
      - name: Check the pinned Kombai CLI
        run: node scripts/cli-version.mjs check
      - name: Validate Codex plugin
        run: node scripts/codex-plugin.mjs validate
      - name: Validate Claude Code plugin
        run: node scripts/claude-code-plugin.mjs validate
      - name: Validate Cursor plugin
        run: node scripts/cursor-plugin.mjs validate
      - name: Validate VS Code plugin
        run: node scripts/vscode-plugin.mjs validate
      - name: Validate Antigravity plugin
        run: node scripts/antigravity-plugin.mjs validate
      - name: Validate Gemini CLI extension
        run: node scripts/gemini-cli-plugin.mjs validate
